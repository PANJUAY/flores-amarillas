<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Amarillas</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* PANTALLA INICIAL */
.inicio {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #252000, #000 65%);
}

.inicio h1 {
    color: #ffd900;
    font-size: 42px;
    text-shadow:
        0 0 10px #ffd900,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;
    margin-bottom: 40px;
}

.boton {
    padding: 18px 40px;
    border: 2px solid #ffd900;
    border-radius: 50px;
    background: transparent;
    color: #ffd900;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 0 20px #ffd900;
    transition: 0.3s;
}

.boton:hover {
    background: #ffd900;
    color: black;
    box-shadow: 0 0 40px #ffd900;
}

/* CAMPO DE FLORES */
.campo {
    display: none;
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #111 0%, #020202 45%, #000 100%);
}

/* ESTRELLAS */
.estrella {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px white;
    animation: brillar 2s infinite alternate;
}

@keyframes brillar {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* TITULO */
.titulo {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    color: #ffe600;
    font-size: 45px;
    font-family: cursive;
    text-shadow:
        0 0 10px #ffe600,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;
    z-index: 5;
}

/* FLORES */
.flor {
    position: absolute;
    font-size: 55px;
    filter:
        drop-shadow(0 0 8px #ffd000)
        drop-shadow(0 0 18px #ffcc00);
    animation: flotar 4s ease-in-out infinite;
}

@keyframes flotar {
    0%, 100% {
        transform: translateY(0) rotate(-4deg);
    }
    50% {
        transform: translateY(-15px) rotate(4deg);
    }
}

/* FRASES */
.frase {
    position: absolute;
    color: white;
    font-family: cursive;
    font-size: 20px;
    text-shadow:
        0 0 5px white,
        0 0 12px #ffd900;
    z-index: 3;
}

.frase.amarilla {
    color: #ffe600;
}

/* CENTRO */
.centro {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    width: 230px;
    height: 230px;
    border-radius: 50%;
    border: 8px solid #fff000;
    box-shadow:
        0 0 20px #fff000,
        0 0 50px #ffd000,
        inset 0 0 30px #ffd000;
}

/* BOTÓN VOLVER */
.volver {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;
    background: rgba(0,0,0,.6);
    border: 1px solid #ffd900;
    color: #ffd900;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- PANTALLA INICIAL -->
<section class="inicio" id="inicio">

    <h1>🌻 Flores Amarillas 🌻</h1>

    <button class="boton" onclick="entrar()">
        Abrir sorpresa
    </button>

</section>


<!-- CAMPO DE FLORES -->
<section class="campo" id="campo">

    <button class="volver" onclick="volver()">
        ← Volver
    </button>

    <div class="titulo">
        Flores Amarillas 🌻
    </div>

    <!-- CENTRO -->
    <div class="centro"></div>

    <!-- FLORES -->
    <div class="flor" style="left:5%; top:35%;">🌻</div>
    <div class="flor" style="left:18%; top:70%;">🌻</div>
    <div class="flor" style="left:35%; top:45%;">🌻</div>
    <div class="flor" style="left:52%; top:75%;">🌻</div>
    <div class="flor" style="left:70%; top:40%;">🌻</div>
    <div class="flor" style="left:85%; top:68%;">🌻</div>
    <div class="flor" style="left:45%; top:25%;">🌻</div>
    <div class="flor" style="left:8%; top:85%;">🌻</div>
    <div class="flor" style="left:78%; top:20%;">🌻</div>

    <!-- FRASES -->
    <div class="frase" style="left:5%; top:48%;">
        Flores para ti
    </div>

    <div class="frase amarilla" style="left:18%; top:58%;">
        Para ti
    </div>

    <div class="frase" style="left:65%; top:52%;">
        Solo para ti
    </div>

    <div class="frase amarilla" style="left:75%; top:75%;">
        Feliz día 🌻
    </div>

    <div class="frase" style="left:35%; top:85%;">
        Siempre contigo
    </div>

</section>


<script>

function entrar() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("campo").style.display = "block";

    crearEstrellas();
}

function volver() {
    document.getElementById("campo").style.display = "none";
    document.getElementById("inicio").style.display = "flex";
}

function crearEstrellas() {

    const campo = document.getElementById("campo");

    for (let i = 0; i < 180; i++) {

        let estrella = document.createElement("div");

        estrella.classList.add("estrella");

        estrella.style.left = Math.random() * 100 + "%";
        estrella.style.top = Math.random() * 100 + "%";

        estrella.style.animationDelay =
            Math.random() * 2 + "s";

        campo.appendChild(estrella);
    }
}

</script>

</body>
</html>
